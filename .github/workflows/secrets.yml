# Secret scanning for every push to a branch other than main (REQ-CI-04). ci.yml scans main and
# every pull request; this catches a key pushed to a feature branch before any PR is opened.
# Only gitleaks runs here, so a branch push does not run the whole suite twice.
# Keep GITLEAKS_VERSION and the steps identical to ci.yml's secrets job (tests/test_ci.py checks it).
name: secrets

on:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.24.3"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: scan the full history
        run: gitleaks git --redact --verbose --exit-code 1 .
