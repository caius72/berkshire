# CI for Berkshire, modelled on matlab-tui's .gitlab-ci.yml (REQ-CI).
# No LLM, no eToro and no network data are needed: the suite runs offline on fakes
# (tests/conftest.py). Live behaviour is covered by the manual procedures in
# docs/test-plan.md §4.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default (REQ-CI-08); jobs that need more ask for it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Pinned so a ruff release cannot change the verdict on unchanged code; bump deliberately.
  RUFF_VERSION: "0.16.5"

jobs:
  # The whole suite with every extra installed, under coverage: only here can every
  # path run. The floor lives in pyproject.toml ([tool.coverage.report] fail_under)
  # and only ratchets up (REQ-CI-03).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked --all-extras
      - run: uv run python -m compileall -q berkshire tests
      - run: bash -n bin/berkshire
      - name: pytest with branch coverage
        run: uv run pytest -q --cov --cov-report=term --cov-report=xml
      # The floor only ratchets if someone raises it: fail when coverage has risen 2 or more points
      # above it, so the headroom that lets untested code land stays small (REQ-CI-03).
      - name: coverage floor keeps up
        run: |
          total=$(uv run coverage report --format=total --precision=2)
          floor=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['tool']['coverage']['report']['fail_under'])")
          echo "coverage ${total}% against a floor of ${floor}%"
          uv run python -c "import sys; t, f = float('${total}'), float('${floor}'); sys.exit(f'coverage {t}% is {t - f:.2f} points above the floor: raise fail_under in pyproject.toml' if t - f >= 2 else 0)"
      - name: coverage summary
        if: always()
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  # Deliberately WITHOUT the optional `tui` extra: REQ-UI-09 says the engine, server
  # and web view must not need textual, and a job that never installs it is the only
  # thing that proves it (same reasoning as matlab-tui's `test` job, REQ-CI-06).
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked
      - name: textual must be ABSENT here
        run: uv run --no-sync python -c "import importlib.util as u; assert not u.find_spec('textual'), 'optional dep present'"
      - run: uv run --no-sync pytest -q
      - name: berkshire tui explains the missing extra
        run: |
          set +e
          uv run --no-sync python -m berkshire tui 2> err.txt
          code=$?
          set -e
          test "$code" -eq 3
          grep -q "optional 'tui' extra" err.txt

  # Rules are explicit in ruff.toml, including bandit (S) security checks, and layout is
  # checked by the same pinned ruff's formatter (REQ-CI-02).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx "ruff@${RUFF_VERSION}" check --output-format=github .
      - run: uvx "ruff@${RUFF_VERSION}" format --check .   # layout, same pinned ruff (Python sources only, see ruff.toml)

  # webui/dist is not committed, so CI proves the bundle still builds, the React code passes
  # the pinned linter, and the pure modules (markdown, SSE parser, token handling) pass their tests (REQ-CI-07).
  webui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
      - run: npm run lint     # Biome, pinned in package.json, rules in webui/biome.json
      - run: npm test
      - run: npm run build
      - run: test -f dist/index.html

  # Secret-leak detection over the whole history, not just the diff: a key committed
  # and then deleted is still leaked (REQ-CI-04). The gitleaks binary runs directly,
  # not gitleaks-action: the action scans only the pushed range, and on a repository's
  # first push that range starts at a parent that does not exist, so the scan fails.
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.24.3"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: scan the full history
        run: gitleaks git --redact --verbose --exit-code 1 .

  # SAST for the Python engine/server and the React view (REQ-CI-05). Results go to code
  # scanning (the Security tab; the repository is public), and the SARIF is also kept as an
  # artifact. Code scanning alone does not fail a run, so the gate step still fails the job
  # on any finding except rule+file pairs triaged in .github/codeql-reviewed.json, each with its reason.
  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read            # private repos: CodeQL reads the workflow run
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
          upload: always
          output: sarif-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-${{ matrix.language }}
          path: sarif-results
      - name: fail on findings
        run: |
          python3 - <<'PY'
          import glob, json, sys
          reviewed = {(r["rule"], r["file"]): r["reason"] for r in json.load(open(".github/codeql-reviewed.json"))}
          found = []
          for f in glob.glob("sarif-results/*.sarif"):
              for run in json.load(open(f))["runs"]:
                  for r in run.get("results", []):
                      loc = r["locations"][0]["physicalLocation"]
                      uri, line = loc["artifactLocation"]["uri"], loc["region"].get("startLine")
                      if (r["ruleId"], uri) in reviewed:
                          print(f"::notice file={uri},line={line}::CodeQL {r['ruleId']} (reviewed)")
                      else:
                          print(f"::error file={uri},line={line}::CodeQL {r['ruleId']}: {r['message']['text']}")
                          found.append(r)
          print(f"{len(found)} unreviewed CodeQL finding(s)")
          sys.exit(1 if found else 0)
          PY
